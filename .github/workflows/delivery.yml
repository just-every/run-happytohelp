name: Build HappyToHelp delivery artifact

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: delivery-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Verify owns runtime/browser coverage, including mobile. This job owns the
    # real distributable; the two-checkout reproducibility proof runs nightly
    # with the installer journeys.
    # Production authority belongs to the independent delivery service:
    # no environment, production secret or id-token permission belongs here.
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build delivery artifact
        run: pnpm run build
      - name: Confirm build preserves source
        run: git diff --exit-code && test -z "$(git ls-files --others --exclude-standard)"
      - uses: actions/upload-artifact@v4
        with:
          name: happytohelp-worker-${{ github.sha }}
          path: delivery-artifact/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve failed build diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: native-runtime-failure-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            /tmp/h2h-native-runtime-*/runtime.log
          if-no-files-found: ignore
          retention-days: 7
