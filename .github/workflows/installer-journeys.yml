name: Installer and README journeys

# Fresh-clone installs/restores, two-location reproducibility and release upgrades are
# retained on Verify's reusable slow qualification lane.
# Verify selects nightly on Monday/Thursday and all coverage on release tags.
on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: installer-journeys-${{ github.ref }}
  cancel-in-progress: false

env:
  WRANGLER_SEND_METRICS: 'false'
  PLAYWRIGHT_SKIP_BROWSER_GC: '1'

jobs:
  journeys:
    name: Installer / ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: native-command-and-portability
            browser: false
            command: pnpm run test:installer-nightly --test-name-pattern=installs.with.the.rer
          - name: readme-clone-and-restore
            browser: true
            command: pnpm run test:installer-nightly --test-name-pattern=README
          - name: reproducible-build
            browser: false
            command: pnpm run test:installer-nightly --test-name-pattern=byte-identical
          - name: delegation-fresh-clone-browser
            browser: true
            command: pnpm run test:installer-nightly --test-name-pattern=agent.fix
          - name: offline-deployment-preflight
            browser: false
            command: pnpm run test:installer-nightly --test-name-pattern=native.owner
          - name: portable-installation-compatibility
            browser: false
            command: pnpm run test:installer-nightly --test-name-pattern=Platform.and.native
          - name: import-and-report-scale
            browser: false
            command: pnpm run test:scale
          # The script reports missing disposable-installation configuration as
          # skipped; a skip is never live-provider qualification.
          - name: configured-live-provider
            browser: true
            command: pnpm run test:live
          - name: release-upgrades
            browser: false
            command: pnpm run test:installer-nightly --test-name-pattern=every.published.release
    steps:
      - name: Configure evidence directory
        run: echo "H2H_EVIDENCE_DIR=$RUNNER_TEMP/happytohelp-evidence" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - name: Prepare space for fresh native checkouts
        # Retain rer's real disk guard; this app does not use the Android SDK.
        run: |
          bash scripts/ci/ensure-disk-space.sh
      - name: Set runner-owned caches
        run: |
          pnpm config set store-dir "$RUNNER_TEMP/pnpm-store"
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s/ms-playwright\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/pnpm-store" "$RUNNER_TEMP/ms-playwright" "$RUNNER_TEMP/rer-apt/archives"
      - name: Cache frozen dependencies and Chromium
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/pnpm-store
            ${{ runner.temp }}/ms-playwright
            ${{ runner.temp }}/rer-apt/archives/*.deb
          key: h2h-ubuntu24-temp-v1-${{ runner.arch }}-browser-${{ matrix.browser }}-${{ hashFiles('pnpm-lock.yaml', 'package.json') }}
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        if: ${{ matrix.browser }}
        run: |
          bash scripts/ci/install-chromium.sh
      - if: ${{ matrix.name == 'release-upgrades' }}
        run: pnpm run build
      - name: Run complete fresh-clone journey
        env:
          H2H_CI_COMMANDS: ${{ matrix.command }}
        run: node scripts/ci/run-checks.mjs
      - name: Confirm journey preserves source
        if: ${{ !cancelled() }}
        run: git diff --exit-code && test -z "$(git ls-files --others --exclude-standard)"
      - name: Upload journey evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: installer-evidence-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/happytohelp-evidence
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload failure diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: installer-failure-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/h2h-native-runtime-*/runtime.log
            /tmp/h2h-independent-*/runtime.log
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  legacy-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: fixture-mysql-admin
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pfixture-mysql-admin"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - name: Set runner-owned caches
        run: |
          pnpm config set store-dir "$RUNNER_TEMP/pnpm-store"
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s/ms-playwright\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/pnpm-store" "$RUNNER_TEMP/ms-playwright" "$RUNNER_TEMP/rer-apt/archives"
      - name: Cache frozen dependencies and Chromium
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/pnpm-store
            ${{ runner.temp }}/ms-playwright
            ${{ runner.temp }}/rer-apt/archives/*.deb
          key: h2h-ubuntu24-temp-v1-${{ runner.arch }}-browser-false-${{ hashFiles('pnpm-lock.yaml', 'package.json') }}
      - run: pnpm install --frozen-lockfile
      - name: Export two legacy projects and import each twice
        env:
          LEGACY_TEST_MYSQL_HOST: 127.0.0.1
          LEGACY_TEST_MYSQL_PASSWORD: fixture-mysql-admin
        run: node --test tests/legacy-export.mjs
