name: Installer and README journeys

# Fresh-clone installs/restores, two-location reproducibility and release upgrades are
# retained on the slow qualification lane.
# Branch pushes and pull requests use Verify's bounded native/build checks.
on:
  push:
    tags: ['v*']
  schedule:
    - cron: '47 3 * * 1,4'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: installer-journeys-${{ github.ref }}
  cancel-in-progress: false

env:
  WRANGLER_SEND_METRICS: 'false'

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      skip: ${{ steps.previous.outputs.skip }}
    steps:
      - id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prior=$(gh api "repos/${{ github.repository }}/actions/workflows/installer-journeys.yml/runs?head_sha=${{ github.sha }}&status=success&per_page=100" --jq '[.workflow_runs[] | select(.event == "push" or .event == "schedule")] | length')
          echo "skip=$([ "$prior" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: tar -czf "$RUNNER_TEMP/happytohelp-build.tar.gz" dist delivery-artifact .generated migrations/core public/widget.js public/downloads src/routeTree.gen.ts
      - uses: actions/upload-artifact@v4
        with:
          name: qualification-build-${{ github.run_id }}
          path: ${{ runner.temp }}/happytohelp-build.tar.gz
          retention-days: 1

  journeys:
    needs: [plan, build]
    if: needs.plan.outputs.skip != 'true'
    name: Installer / ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: native-command-and-portability
            browser: false
            command: pnpm run test:installer-nightly --test-name-pattern=installs.with.the.rer
          - name: readme-clone-and-restore
            browser: true
            command: pnpm run test:installer-nightly --test-name-pattern=README
          - name: reproducible-build
            browser: false
            command: pnpm run test:installer-nightly --test-name-pattern=byte-identical
          - name: delegation-fresh-clone-browser
            browser: true
            command: pnpm run test:installer-nightly --test-name-pattern=agent.fix
          - name: release-upgrades
            browser: false
            command: pnpm run test:installer-nightly --test-name-pattern=every.published.release
          - name: archive-variants
            browser: false
            command: pnpm run test:installer-nightly --test-name-pattern=archive
          - name: scale-and-historical-data
            browser: false
            command: pnpm run test:nightly
    steps:
      - name: Configure evidence directory
        run: echo "H2H_EVIDENCE_DIR=$RUNNER_TEMP/happytohelp-evidence" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
      - name: Prepare space for fresh native checkouts
        # Retain rer's real disk guard; this app does not use the Android SDK.
        run: |
          bash scripts/ci/ensure-disk-space.sh
      - run: pnpm install --frozen-lockfile
      - name: Cache Chromium fallback packages
        if: ${{ matrix.browser }}
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/rer-apt/archives
          key: chromium-apt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium
        if: ${{ matrix.browser }}
        run: |
          set -euo pipefail
          pnpm exec playwright install chromium
          pnpm exec node scripts/chromium-probe.mjs || \
            sudo env "PATH=$PATH" "APT_ARCHIVES=$RUNNER_TEMP/rer-apt/archives" python3 scripts/ci/install-chromium-deps.py
      - uses: actions/download-artifact@v4
        with:
          name: qualification-build-${{ github.run_id }}
          path: ${{ runner.temp }}/qualification-build
      - run: tar -xzf "$RUNNER_TEMP/qualification-build/happytohelp-build.tar.gz"
      - name: Run complete fresh-clone journey
        env:
          H2H_CI_COMMANDS: ${{ matrix.command }}
        run: node scripts/ci/run-checks.mjs
      - name: Confirm journey preserves source
        if: ${{ !cancelled() }}
        run: git diff --exit-code && test -z "$(git ls-files --others --exclude-standard)"
      - name: Upload journey evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: installer-evidence-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/happytohelp-evidence
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload failure diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: installer-failure-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/h2h-native-runtime-*/runtime.log
            /tmp/h2h-independent-*/runtime.log
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  legacy-export:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: fixture-mysql-admin
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pfixture-mysql-admin"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Export two legacy projects and import each twice
        env:
          LEGACY_TEST_MYSQL_HOST: 127.0.0.1
          LEGACY_TEST_MYSQL_PASSWORD: fixture-mysql-admin
        run: node --test tests/legacy-export.mjs
