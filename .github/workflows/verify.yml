name: Verify

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '47 4 * * 1,4'
  workflow_dispatch:
    inputs:
      tier:
        description: Verification tier
        type: choice
        options: [push, nightly, all]
        default: all

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  WRANGLER_SEND_METRICS: 'false'
  PLAYWRIGHT_SKIP_BROWSER_GC: '1'

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.plan.outputs.skip }}
      tier: ${{ steps.plan.outputs.tier }}
      coverage: ${{ steps.plan.outputs.coverage }}
      readers: ${{ steps.plan.outputs.readers }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Look up complete nightly marker
        id: nightly
        if: ${{ github.event_name == 'schedule' || inputs.tier == 'nightly' }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/nightly-green
          key: h2h-nightly-green-v1-${{ github.sha }}
          lookup-only: true
      - id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TIER: ${{ inputs.tier || 'push' }}
          NIGHTLY_CACHE_HIT: ${{ steps.nightly.outputs.cache-hit }}
        run: node scripts/ci/verify-lifecycle.mjs --plan

  build:
    needs: plan
    if: ${{ needs.plan.outputs.coverage != 'reuse' && needs.plan.outputs.tier != 'nightly' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Only generated, public build output is shared; no local state or secrets.
    steps:
      - uses: actions/checkout@v4
        with:
          # The contract reader verifies the recorded pre-conversion sources.
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - name: Set runner-owned caches
        run: |
          pnpm config set store-dir "$RUNNER_TEMP/pnpm-store"
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s/ms-playwright\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/pnpm-store" "$RUNNER_TEMP/ms-playwright" "$RUNNER_TEMP/rer-apt/archives"
      - name: Cache frozen dependencies and Chromium
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/pnpm-store
            ${{ runner.temp }}/ms-playwright
            ${{ runner.temp }}/rer-apt/archives/*.deb
          key: h2h-ubuntu24-temp-v1-${{ runner.arch }}-browser-false-${{ hashFiles('pnpm-lock.yaml', 'package.json') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec rer describe
      - run: node src/site/base/contract-docs.mjs check
      - run: node scripts/edition-authoring/cli.mjs check
      - run: node scripts/contract-docs.mjs check
      - run: pnpm run typecheck
      - run: pnpm exec rer check --profile first-party
      - run: pnpm run build
      - name: Run reviewed light readers and build the run site
        if: ${{ needs.plan.outputs.coverage == 'light' }}
        env:
          LIGHT_READERS: ${{ needs.plan.outputs.readers }}
        run: |
          node scripts/ci/verify-lifecycle.mjs --light
          pnpm run build --site
      - name: Package internal build output
        run: >-
          tar -czf "$RUNNER_TEMP/happytohelp-build.tar.gz"
          dist delivery-artifact .generated migrations/core public/widget.js public/downloads src/routeTree.gen.ts
      - uses: actions/upload-artifact@v4
        with:
          name: verify-build-${{ github.run_id }}
          overwrite: true
          path: ${{ runner.temp }}/happytohelp-build.tar.gz
          if-no-files-found: error
          retention-days: 1
      - name: Confirm build preserves source
        run: git diff --exit-code && test -z "$(git ls-files --others --exclude-standard)"
      - name: Upload build failure diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: failure-diagnostics-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/h2h-native-runtime-*/runtime.log
            /tmp/h2h-independent-*/runtime.log
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  checks:
    needs: [plan, build]
    if: ${{ needs.plan.outputs.coverage == 'full' && needs.plan.outputs.tier != 'nightly' }}
    name: Verify / ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: identity-and-desk
            browser: false
            commands: |
              node --test --test-concurrency=1 tests/journeys/identity.mjs tests/journeys/erasure.mjs tests/journeys/inbox.mjs tests/journeys/first-run.mjs tests/journeys/customers.mjs
          - name: assistant-and-knowledge
            browser: false
            commands: |
              node --test --test-concurrency=1 tests/journeys/ai.mjs tests/journeys/context.mjs tests/journeys/knowledge.mjs tests/journeys/email.mjs
          - name: connections-and-computers
            browser: false
            commands: |
              node --test --test-concurrency=1 tests/journeys/connections.mjs tests/journeys/widget.mjs tests/journeys/delegation.mjs tests/journeys/delegation-computers.mjs tests/journeys/connector.mjs tests/journeys/upgrade.mjs tests/journeys/runtime.mjs
          - name: import-and-reports
            browser: false
            commands: |
              node --test --test-concurrency=1 tests/journeys/move-in-admission.mjs tests/journeys/move-in-custody.mjs tests/journeys/move-in-erasure.mjs tests/journeys/reports.mjs tests/journeys/legacy.mjs tests/journeys/public.mjs
          - name: support-workflow-browser
            browser: true
            commands: |
              node --test --test-concurrency=1 tests/journeys/workflows-browser.mjs
          - name: support-and-recovery
            browser: true
            commands: |
              node --test --test-concurrency=1 tests/journeys/inbox-browser.mjs tests/journeys/restore.mjs
          - name: identity-and-repair-browser
            browser: true
            commands: |
              node --test --test-concurrency=1 tests/journeys/identity-browser.mjs tests/journeys/delegation-browser.mjs
          - name: public-and-import-browser
            browser: true
            commands: |
              node --test --test-concurrency=1 tests/journeys/public-browser.mjs tests/journeys/move-in-browser.mjs tests/journeys/erasure-browser.mjs
    steps:
      - name: Configure evidence directory
        run: echo "H2H_EVIDENCE_DIR=$RUNNER_TEMP/happytohelp-evidence" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - name: Set runner-owned caches
        run: |
          pnpm config set store-dir "$RUNNER_TEMP/pnpm-store"
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s/ms-playwright\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/pnpm-store" "$RUNNER_TEMP/ms-playwright" "$RUNNER_TEMP/rer-apt/archives"
      - name: Cache frozen dependencies and Chromium
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/pnpm-store
            ${{ runner.temp }}/ms-playwright
            ${{ runner.temp }}/rer-apt/archives/*.deb
          key: h2h-ubuntu24-temp-v1-${{ runner.arch }}-browser-${{ matrix.browser }}-${{ hashFiles('pnpm-lock.yaml', 'package.json') }}
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: verify-build-${{ github.run_id }}
          path: ${{ runner.temp }}/verify-build
      - name: Restore the build from this workflow's exact checkout
        run: tar -xzf "$RUNNER_TEMP/verify-build/happytohelp-build.tar.gz"
      - name: Install Chromium
        if: ${{ matrix.browser }}
        run: |
          bash scripts/ci/install-chromium.sh
      # Every command in a shard runs even after another check fails.
      - name: Run shard checks
        env:
          H2H_CI_COMMANDS: ${{ matrix.commands }}
        run: node scripts/ci/run-checks.mjs
      - name: Confirm checks preserve source
        if: ${{ !cancelled() }}
        run: git diff --exit-code && test -z "$(git ls-files --others --exclude-standard)"
      - name: Upload browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/happytohelp-evidence
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload failure diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: failure-diagnostics-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/h2h-native-runtime-*/runtime.log
            /tmp/h2h-independent-*/runtime.log
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  slow:
    needs: plan
    if: ${{ needs.plan.outputs.coverage == 'full' && needs.plan.outputs.tier != 'push' }}
    permissions:
      contents: read
    uses: ./.github/workflows/installer-journeys.yml

  full-push-proof:
    needs: [plan, build, checks]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && needs.plan.outputs.tier == 'push' && needs.plan.outputs.coverage == 'full' && needs.build.result == 'success' && needs.checks.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - run: test '${{ needs.build.result }}:${{ needs.checks.result }}' = success:success

  nightly-proof:
    needs: [plan, slow]
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && (needs.plan.outputs.tier == 'nightly' || needs.plan.outputs.tier == 'all') && needs.plan.outputs.coverage == 'full' && needs.slow.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Mark complete nightly coverage
        run: mkdir -p "$RUNNER_TEMP/nightly-green" && printf '%s\n' '${{ github.sha }}' > "$RUNNER_TEMP/nightly-green/sha"
      - uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/nightly-green
          key: h2h-nightly-green-v1-${{ github.sha }}

  verify:
    needs: [plan, build, checks, slow, full-push-proof, nightly-proof]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require the plan and every selected check
        env:
          PLAN: ${{ needs.plan.result }}
          SKIP: ${{ needs.plan.outputs.skip }}
          TIER: ${{ needs.plan.outputs.tier }}
          COVERAGE: ${{ needs.plan.outputs.coverage }}
          BUILD: ${{ needs.build.result }}
          CHECKS: ${{ needs.checks.result }}
          SLOW: ${{ needs.slow.result }}
          PUSH_PROOF: ${{ needs.full-push-proof.result }}
          NIGHTLY_PROOF: ${{ needs.nightly-proof.result }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$PLAN" = success
          case "$PUSH_PROOF:$NIGHTLY_PROOF" in *failure*|*cancelled*) exit 1 ;; esac
          case "$COVERAGE:$TIER" in
            reuse:push|reuse:nightly)
              test "$SKIP:$BUILD:$CHECKS:$SLOW" = true:skipped:skipped:skipped ;;
            light:push)
              test "$SKIP:$BUILD:$CHECKS:$SLOW" = false:success:skipped:skipped ;;
            full:push)
              test "$SKIP:$BUILD:$CHECKS:$SLOW" = false:success:success:skipped
              if [ "$GITHUB_EVENT_NAME" = push ]; then test "$PUSH_PROOF" = success; fi ;;
            full:nightly)
              test "$SKIP:$BUILD:$CHECKS:$SLOW" = false:skipped:skipped:success ;;
            full:all)
              test "$SKIP:$BUILD:$CHECKS:$SLOW" = false:success:success:success ;;
            *) exit 1 ;;
          esac
          node scripts/ci/verify-lifecycle.mjs --require-pr
