name: Verify

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  WRANGLER_SEND_METRICS: 'false'

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.reuse.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          WF_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          wf="${WF_REF%@*}"; wf="${wf##*/}"
          # Only a push of this workflow from this repository can authorize reuse.
          newest_push() {
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?head_sha=$1&event=push&per_page=100" \
              --jq "[.workflow_runs[] | select(.head_repository.full_name == \"$GITHUB_REPOSITORY\" and .id != $GITHUB_RUN_ID)] | max_by(.id) | select(. != null) | \"\(.status) \(.conclusion)\"" || true
          }
          green() { [ "$(newest_push "$1")" = "completed success" ]; }
          skip=false
          # C1: reuse a green branch push when main receives the identical SHA.
          if [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ] && green "$GITHUB_SHA"; then skip=true; fi
          # C3: an identical parent tree needs a green push of that parent.
          if [ "$skip" = false ] && [ "$EVENT" = push ] && parent=$(git rev-parse -q --verify HEAD~1) \
             && [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'HEAD~1^{tree}')" ] && green "$parent"; then skip=true; fi
          # C2: a same-repository PR waits for its head's push, at most 25 minutes.
          if [ "$EVENT" = pull_request ] && [ "$SAME_REPO" = true ]; then
            for _ in $(seq 1 50); do
              state=$(newest_push "$PR_HEAD")
              case "$state" in
                'completed success') skip=true; break ;;
                ''|completed\ *) break ;;
                *) sleep 30 ;;
              esac
            done
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Only generated, public build output is shared; no local state or secrets.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec rer describe
      - run: node scripts/edition-authoring/cli.mjs check
      - run: pnpm exec rer check --profile first-party
      - run: pnpm run build
      - name: Package internal build output
        run: >-
          tar -czf "$RUNNER_TEMP/happytohelp-build.tar.gz"
          dist delivery-artifact .generated migrations/core public/widget.js public/downloads src/routeTree.gen.ts
      - uses: actions/upload-artifact@v4
        with:
          name: verify-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/happytohelp-build.tar.gz
          if-no-files-found: error
          retention-days: 1
      - name: Confirm build preserves source
        run: git diff --exit-code && test -z "$(git ls-files --others --exclude-standard)"
      - name: Upload build failure diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: failure-diagnostics-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/h2h-native-runtime-*/runtime.log
            /tmp/h2h-independent-*/runtime.log
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  checks:
    needs: [plan, build]
    if: needs.plan.outputs.skip != 'true'
    name: Verify / ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: shard-1
            browser: true
            # Last green main check time: 1020 seconds across these unchanged commands.
            commands: |
              node --test --test-concurrency=1 --test-skip-pattern=management.libraries --test-skip-pattern=appearance.settings tests/journeys/inbox-browser.mjs
              node --test --test-concurrency=1 tests/journeys/move-in-erasure.mjs
          - name: shard-2
            browser: true
            # Last green main check time: 1029 seconds across these unchanged commands.
            commands: |
              node --test --test-concurrency=1 tests/journeys/widget-browser.mjs tests/journeys/ai-browser.mjs
              node --test --test-concurrency=1 tests/journeys/move-in-custody.mjs tests/journeys/move-in-capacity.mjs
          - name: shard-3
            browser: true
            # Last green main check time: 998 seconds across these unchanged commands.
            commands: |
              node --test --test-concurrency=1 tests/journeys/ai.mjs tests/journeys/public.mjs tests/journeys/email.mjs tests/journeys/knowledge.mjs tests/journeys/inbox.mjs tests/journeys/widget.mjs tests/journeys/erasure.mjs tests/journeys/legacy.mjs tests/journeys/context.mjs
              node --test --test-concurrency=1 --test-name-pattern=dashboard.is.ready tests/journeys/first-run-browser.mjs
          - name: shard-4
            browser: true
            # Last green main check time: 913 seconds across these unchanged commands.
            commands: |
              node --test --test-concurrency=1 tests/journeys/public-browser.mjs tests/journeys/identity-browser.mjs
              node tests/demo-inbox-browser.mjs
              node --test --test-concurrency=1 tests/journeys/context-browser.mjs
          - name: shard-5
            browser: true
            # Last green main check time: 904 seconds across these unchanged commands.
            commands: |
              node --test --test-concurrency=1 --test-skip-pattern=dashboard.is.ready tests/journeys/first-run-browser.mjs
              node --test --test-concurrency=1 tests/journeys/runtime.mjs tests/journeys/identity.mjs tests/journeys/installer.mjs
          - name: shard-6
            browser: true
            # Last green main check time: 906 seconds across these unchanged commands.
            commands: |
              node --test --test-concurrency=1 tests/journeys/reports.mjs tests/journeys/first-run.mjs tests/journeys/upgrade.mjs
              node --test --test-concurrency=1 --test-skip-pattern=selected.engineering tests/journeys/move-in-browser.mjs tests/journeys/reports-browser.mjs tests/journeys/connections-browser.mjs tests/journeys/erasure-browser.mjs
              pnpm run verify:build
          - name: shard-7
            browser: true
            # Last green main check time: 1058 seconds across these unchanged commands.
            commands: |
              node --test --test-concurrency=1 tests/journeys/move-in-admission.mjs
              node --test --test-concurrency=1 tests/journeys/restore.mjs
              node --test --test-concurrency=1 --test-name-pattern=engineering tests/journeys/connections.mjs
              node --test --test-concurrency=1 --test-name-pattern=selected.engineering tests/journeys/connections-browser.mjs
          - name: shard-8
            browser: true
            # Last green main check time: 1085 seconds across these unchanged commands.
            commands: |
              node --test --test-concurrency=1 --test-name-pattern=management.libraries --test-name-pattern=appearance.settings tests/journeys/inbox-browser.mjs
              node --test --test-concurrency=1 --test-skip-pattern=engineering tests/journeys/connections.mjs tests/journeys/delegation.mjs tests/journeys/delegation-computers.mjs tests/journeys/connector.mjs
              node --test --test-concurrency=1 tests/journeys/delegation-browser.mjs tests/journeys/connector-browser.mjs
    steps:
      - name: Configure evidence directory
        run: echo "H2H_EVIDENCE_DIR=$RUNNER_TEMP/happytohelp-evidence" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: verify-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verify-build
      - name: Restore the build from this workflow's exact checkout
        run: tar -xzf "$RUNNER_TEMP/verify-build/happytohelp-build.tar.gz"
      # Chromium only where a shard drives a browser.
      - name: Cache Chromium fallback packages
        if: ${{ matrix.browser }}
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/rer-apt/archives
          key: chromium-apt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium
        if: ${{ matrix.browser }}
        run: |
          set -euo pipefail
          pnpm exec playwright install chromium
          pnpm exec node scripts/chromium-probe.mjs || \
            sudo env "PATH=$PATH" "APT_ARCHIVES=$RUNNER_TEMP/rer-apt/archives" python3 scripts/ci/install-chromium-deps.py
      # Every command in a shard runs even after another check fails.
      - name: Run shard checks
        env:
          H2H_CI_COMMANDS: ${{ matrix.commands }}
        run: node scripts/ci/run-checks.mjs
      - name: Confirm checks preserve source
        if: ${{ !cancelled() }}
        run: git diff --exit-code && test -z "$(git ls-files --others --exclude-standard)"
      - name: Upload browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/happytohelp-evidence
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload failure diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: failure-diagnostics-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/h2h-native-runtime-*/runtime.log
            /tmp/h2h-independent-*/runtime.log
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  public-preview:
    needs: [plan, build]
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Configure evidence directory
        run: echo "H2H_EVIDENCE_DIR=$RUNNER_TEMP/happytohelp-evidence" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
      - name: Prepare space for native preview
        run: |
          bash scripts/ci/ensure-disk-space.sh
      - run: pnpm install --frozen-lockfile
      - name: Cache Chromium fallback packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/rer-apt/archives
          key: chromium-apt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium
        run: |
          set -euo pipefail
          pnpm exec playwright install chromium
          pnpm exec node scripts/chromium-probe.mjs || \
            sudo env "PATH=$PATH" "APT_ARCHIVES=$RUNNER_TEMP/rer-apt/archives" python3 scripts/ci/install-chromium-deps.py
      - uses: actions/download-artifact@v4
        with:
          name: verify-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verify-build
      - name: Restore the build from this workflow's exact checkout
        run: tar -xzf "$RUNNER_TEMP/verify-build/happytohelp-build.tar.gz"
      - name: Homepage and public site checks
        env:
          H2H_CI_COMMANDS: |
            node tests/homepage-browser.mjs
        run: node scripts/ci/public-preview.mjs
      - name: Confirm preview preserves source
        if: ${{ !cancelled() }}
        run: git diff --exit-code && test -z "$(git ls-files --others --exclude-standard)"
      - name: Upload browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-public-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/happytohelp-evidence
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload failure diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: failure-diagnostics-public-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/h2h-native-runtime-*/runtime.log
            /tmp/h2h-independent-*/runtime.log
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  legacy-export:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: fixture-mysql-admin
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pfixture-mysql-admin"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Export two legacy projects and import each twice
        env:
          LEGACY_TEST_MYSQL_HOST: 127.0.0.1
          LEGACY_TEST_MYSQL_PASSWORD: fixture-mysql-admin
        run: node --test tests/legacy-export.mjs

  verify:
    needs: [plan, build, checks, public-preview, legacy-export]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require the plan and every check
        env:
          PLAN: ${{ needs.plan.result }}
          SKIP: ${{ needs.plan.outputs.skip }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          test "$PLAN" = success
          if [ "$SKIP" = true ]; then exit 0; fi
          for result in $RESULTS; do test "$result" = success; done
