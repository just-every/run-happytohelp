name: Verify

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  WRANGLER_SEND_METRICS: 'false'

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.reuse.outputs.skip }}
      tier: ${{ steps.reuse.outputs.tier }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          WF_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          source scripts/ci/verify-evidence.sh
          skip=false
          tier=full
          # C1: reuse a green branch push when main receives the identical SHA.
          if [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ] && [ "$(newest_branch_push "$GITHUB_SHA")" = 'completed success' ]; then skip=true; fi
          # C3: reuse a green parent only without conflicting evidence on this SHA.
          if [ "$skip" = false ] && [ "$EVENT" = push ] && parent=$(git rev-parse -q --verify HEAD~1) \
             && [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'HEAD~1^{tree}')" ] \
             && pushes_clear "$GITHUB_SHA" && green "$parent"; then skip=true; fi
          # C2: a same-repository PR waits for its head's push, at most 25 minutes.
          if [ "$EVENT" = pull_request ] && [ "$SAME_REPO" = true ]; then
            for _ in $(seq 1 50); do
              state=$(newest_push "$PR_HEAD")
              case "$state" in
                'completed success') skip=true; break ;;
                ''|unavailable|completed\ *) break ;;
                *) sleep 30 ;;
              esac
            done
          fi
          # Documentation-only changes still check source custody, the contract and the site.
          if [ "$skip" = false ] && [ "$EVENT" = push ] && parent=$(git rev-parse -q --verify HEAD~1) \
             && green "$parent" && git diff --name-only "$parent" HEAD | \
             awk 'BEGIN { ok=1 } !/^(sources\.lock\.json|CONTRACT\.md|ACCEPTANCE\.md|CLAIMS\.md|docs\/CLAIMS\.md|HANDOVER\.md|STATUS\.md|evidence\/.*|\.artifacts\/.*)$/ { ok=0 } END { exit !ok }'; then
            tier=light
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "tier=$tier" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Only generated, public build output is shared; no local state or secrets.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec rer describe
      - run: pnpm exec rer check --profile first-party
      - run: pnpm run source:check
      - run: node scripts/contract-docs.mjs check
      - if: needs.plan.outputs.tier != 'light'
        run: pnpm run typecheck
      - run: node scripts/edition-authoring/cli.mjs verify-base --offline
      - run: pnpm run build
      - name: Package internal build output
        run: >-
          tar -czf "$RUNNER_TEMP/happytohelp-build.tar.gz"
          dist delivery-artifact .generated migrations/core public/widget.js public/downloads src/routeTree.gen.ts
      - uses: actions/upload-artifact@v4
        with:
          name: verify-build-${{ github.run_id }}
          overwrite: true
          path: ${{ runner.temp }}/happytohelp-build.tar.gz
          if-no-files-found: error
          retention-days: 1
      - name: Confirm build preserves source
        run: git diff --exit-code && test -z "$(git ls-files --others --exclude-standard)"
      - name: Upload build failure diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: failure-diagnostics-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/h2h-native-runtime-*/runtime.log
            /tmp/h2h-independent-*/runtime.log
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  checks:
    needs: [plan, build]
    if: needs.plan.outputs.skip != 'true' && needs.plan.outputs.tier != 'light'
    name: Verify / ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: identity
            browser: true
            commands: |
              node --test --test-concurrency=2 tests/journeys/ai.mjs tests/journeys/connections-browser.mjs tests/journeys/delegation.mjs tests/journeys/email.mjs tests/journeys/erasure.mjs tests/journeys/first-run-browser.mjs tests/journeys/identity-browser.mjs tests/journeys/installer.mjs tests/journeys/move-in-custody.mjs tests/journeys/reports-browser.mjs tests/journeys/runtime.mjs tests/sanity/ai/admission.mjs
          - name: activation
            browser: true
            commands: |
              node --test --test-concurrency=2 tests/journeys/brands-browser.mjs tests/journeys/connections.mjs tests/journeys/connector.mjs tests/journeys/context.mjs tests/journeys/first-run.mjs tests/journeys/identity.mjs tests/journeys/legacy.mjs tests/journeys/move-in-admission.mjs tests/journeys/move-in-browser.mjs tests/journeys/procedures-browser.mjs tests/journeys/public.mjs tests/journeys/upgrade.mjs
          - name: operations
            browser: true
            commands: |
              node --test --test-concurrency=2 tests/journeys/inbox-browser.mjs tests/journeys/inbox.mjs tests/journeys/knowledge.mjs tests/journeys/phone-browser.mjs tests/journeys/reports.mjs tests/journeys/widget.mjs
          - name: delegation
            browser: true
            commands: |
              node --test --test-concurrency=2 tests/journeys/delegation-browser.mjs tests/journeys/restore.mjs
    steps:
      - name: Configure evidence directory
        run: echo "H2H_EVIDENCE_DIR=$RUNNER_TEMP/happytohelp-evidence" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: verify-build-${{ github.run_id }}
          path: ${{ runner.temp }}/verify-build
      - name: Restore the build from this workflow's exact checkout
        run: tar -xzf "$RUNNER_TEMP/verify-build/happytohelp-build.tar.gz"
      # Chromium only where a shard drives a browser.
      - name: Cache Chromium fallback packages
        if: ${{ matrix.browser }}
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/rer-apt/archives
          key: chromium-apt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium
        if: ${{ matrix.browser }}
        run: |
          set -euo pipefail
          pnpm exec playwright install chromium
          pnpm exec node scripts/chromium-probe.mjs || \
            sudo env "PATH=$PATH" "APT_ARCHIVES=$RUNNER_TEMP/rer-apt/archives" python3 scripts/ci/install-chromium-deps.py
      # Every command in a shard runs even after another check fails.
      - name: Run shard checks
        env:
          H2H_CI_COMMANDS: ${{ matrix.commands }}
        run: node scripts/ci/run-checks.mjs
      - name: Confirm checks preserve source
        if: ${{ !cancelled() }}
        run: git diff --exit-code && test -z "$(git ls-files --others --exclude-standard)"
      - name: Upload browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/happytohelp-evidence
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload failure diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: failure-diagnostics-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/h2h-native-runtime-*/runtime.log
            /tmp/h2h-independent-*/runtime.log
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  verify:
    needs: [plan, build, checks]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require the plan and every check
        env:
          PLAN: ${{ needs.plan.result }}
          SKIP: ${{ needs.plan.outputs.skip }}
          TIER: ${{ needs.plan.outputs.tier }}
          BUILD: ${{ needs.build.result }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          WF_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          test "$PLAN" = success
          if [ "$SKIP" != true ]; then
            test "$BUILD" = success
            if [ "$TIER" != light ]; then
              for result in $RESULTS; do test "$result" = success; done
            fi
          fi
          # A merge checkout cannot establish that the PR head passed its push.
          # Re-read once at the end, even when the plan previously found green.
          if [ "$EVENT" = pull_request ] && [ "$SAME_REPO" = true ]; then
            source scripts/ci/verify-evidence.sh
            if ! green "$PR_HEAD"; then
              echo 'The newest push Verify on the PR head must succeed.' >&2
              exit 1
            fi
          fi
