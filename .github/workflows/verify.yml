name: Verify

on:
  push:
    branches: [main, release/0.3.x, release/0.4.x]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WRANGLER_SEND_METRICS: 'false'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only generated, public build output is shared; no local state or secrets.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec rer describe
      - run: node scripts/edition-authoring/cli.mjs check
      - run: pnpm exec rer check --profile first-party
      - run: pnpm run build
      - name: Package internal build output
        run: >-
          tar -czf "$RUNNER_TEMP/happytohelp-build.tar.gz"
          dist delivery-artifact .generated migrations/core public/widget.js public/downloads src/routeTree.gen.ts
      - uses: actions/upload-artifact@v4
        with:
          name: verify-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/happytohelp-build.tar.gz
          if-no-files-found: error
          retention-days: 1
      - name: Confirm build preserves source
        run: git diff --exit-code && test -z "$(git ls-files --others --exclude-standard)"
      - name: Upload build failure diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: failure-diagnostics-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/h2h-native-runtime-*/runtime.log
            /tmp/h2h-independent-*/runtime.log
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  checks:
    needs: build
    name: Verify / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: public-browsers
            browser: true
            commands: |
              node --test --test-concurrency=1 tests/journeys/public-browser.mjs tests/journeys/identity-browser.mjs
              node tests/demo-inbox-browser.mjs
          - name: inbox-browser
            browser: true
            commands: |
              node --test --test-concurrency=1 --test-skip-pattern=management.libraries --test-skip-pattern=appearance.settings tests/journeys/inbox-browser.mjs
          - name: move-in-custody-and-capacity
            browser: false
            commands: |
              node --test --test-concurrency=1 tests/journeys/move-in-custody.mjs tests/journeys/move-in-capacity.mjs
          - name: assistant-mail-and-restore
            browser: false
            commands: |
              node --test --test-concurrency=1 tests/journeys/restore.mjs tests/journeys/ai.mjs tests/journeys/public.mjs tests/journeys/email.mjs tests/journeys/knowledge.mjs tests/journeys/inbox.mjs tests/journeys/widget.mjs tests/journeys/erasure.mjs tests/journeys/legacy.mjs tests/journeys/context.mjs
          - name: context-browser
            browser: true
            commands: |
              node --test --test-concurrency=1 tests/journeys/context-browser.mjs
          - name: move-in-admission
            browser: false
            commands: |
              node --test --test-concurrency=1 tests/journeys/move-in-admission.mjs
          - name: connections-and-delegation
            browser: false
            commands: |
              node --test --test-concurrency=1 --test-skip-pattern=engineering tests/journeys/connections.mjs tests/journeys/delegation.mjs tests/journeys/delegation-computers.mjs tests/journeys/connector.mjs
          - name: engineering-escalations
            browser: true
            commands: |
              node --test --test-concurrency=1 --test-name-pattern=engineering tests/journeys/connections.mjs
              node --test --test-concurrency=1 --test-name-pattern=selected.engineering tests/journeys/connections-browser.mjs
          - name: inbox-library-browser
            browser: true
            commands: |
              node --test --test-concurrency=1 --test-name-pattern=management.libraries --test-name-pattern=appearance.settings tests/journeys/inbox-browser.mjs
          - name: runtime-and-identity
            browser: false
            commands: |
              node --test --test-concurrency=1 tests/journeys/runtime.mjs tests/journeys/identity.mjs tests/journeys/installer.mjs
          - name: move-in-erasure
            browser: false
            commands: |
              node --test --test-concurrency=1 tests/journeys/move-in-erasure.mjs
          - name: business-browsers
            browser: true
            commands: |
              node --test --test-concurrency=1 --test-skip-pattern=selected.engineering tests/journeys/move-in-browser.mjs tests/journeys/reports-browser.mjs tests/journeys/connections-browser.mjs tests/journeys/erasure-browser.mjs
          - name: first-run-browser
            browser: true
            commands: |
              node --test --test-concurrency=1 --test-skip-pattern=dashboard.is.ready tests/journeys/first-run-browser.mjs
          - name: first-run-dashboard-browser
            browser: true
            commands: |
              node --test --test-concurrency=1 --test-name-pattern=dashboard.is.ready tests/journeys/first-run-browser.mjs
          - name: widget-browsers
            browser: true
            commands: |
              node --test --test-concurrency=1 tests/journeys/widget-browser.mjs tests/journeys/ai-browser.mjs
          - name: reports-and-first-run
            browser: false
            commands: |
              node --test --test-concurrency=1 tests/journeys/reports.mjs tests/journeys/first-run.mjs tests/journeys/upgrade.mjs
          - name: delegation-browsers
            browser: true
            commands: |
              node --test --test-concurrency=1 tests/journeys/delegation-browser.mjs tests/journeys/connector-browser.mjs
          - name: contracts
            browser: false
            # The Managed build's verify (rer-project.json operations.verify).
            commands: |
              pnpm run verify:build
    steps:
      - name: Configure evidence directory
        run: echo "H2H_EVIDENCE_DIR=$RUNNER_TEMP/happytohelp-evidence" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: verify-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verify-build
      - name: Restore the build from this workflow's exact checkout
        run: tar -xzf "$RUNNER_TEMP/verify-build/happytohelp-build.tar.gz"
      # Chromium only where a shard drives a browser.
      - if: ${{ matrix.browser }}
        run: pnpm exec playwright install --with-deps chromium
      # Every command in a shard runs even after another check fails.
      - name: Run shard checks
        env:
          H2H_CI_COMMANDS: ${{ matrix.commands }}
        run: node scripts/ci/run-checks.mjs
      - name: Confirm checks preserve source
        if: ${{ !cancelled() }}
        run: git diff --exit-code && test -z "$(git ls-files --others --exclude-standard)"
      - name: Upload browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/happytohelp-evidence
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload failure diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: failure-diagnostics-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/h2h-native-runtime-*/runtime.log
            /tmp/h2h-independent-*/runtime.log
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  public-preview:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      H2H_PREVIEW_ORIGIN: http://127.0.0.1:5186
    steps:
      - name: Configure evidence directory
        run: echo "H2H_EVIDENCE_DIR=$RUNNER_TEMP/happytohelp-evidence" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
      - name: Prepare space for native preview
        run: |
          df -h "$RUNNER_TEMP" "$GITHUB_WORKSPACE"
          sudo rm -rf -- /usr/local/lib/android
          df -h "$RUNNER_TEMP" "$GITHUB_WORKSPACE"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start local native preview
        id: preview
        run: |
          node --input-type=module -e 'import {mkdir,writeFile} from "node:fs/promises"; import {randomBytes} from "node:crypto"; await mkdir(".seed",{recursive:true,mode:0o700}); await writeFile(".seed/native-preview-answers.json",JSON.stringify({WORKSPACE_NAME:"CI preview",WIDGET_ORIGIN:"https://example.test",PRIMARY_COLOR:"#7c3aed",OWNER_NAME:"CI owner",OWNER_PASSWORD:randomBytes(24).toString("base64url"),EMAIL_PROVIDER:"later"}),{mode:0o600});'
          pnpm exec rer setup --owner-email ci-preview@example.test --answers .seed/native-preview-answers.json --port 5186 --non-interactive
          nohup pnpm exec rer preview --port 5186 --non-interactive > "$RUNNER_TEMP/native-preview.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS "$H2H_PREVIEW_ORIGIN/health"; then exit 0; fi
            sleep 2
          done
          echo "Local native preview did not become healthy" >&2
          exit 1
      - name: Homepage and public site checks
        if: ${{ !cancelled() && steps.preview.outcome == 'success' }}
        env:
          H2H_TEST_ORIGIN: ${{ env.H2H_PREVIEW_ORIGIN }}
          H2H_CI_COMMANDS: |
            node tests/homepage-browser.mjs
        run: node scripts/ci/run-checks.mjs
      - name: Stop local native preview
        if: ${{ always() && steps.preview.outcome != 'skipped' }}
        run: pnpm exec rer preview --stop --non-interactive
      - name: Confirm preview preserves source
        if: ${{ !cancelled() && steps.preview.outcome == 'success' }}
        run: git diff --exit-code && test -z "$(git ls-files --others --exclude-standard)"
      - name: Upload browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-public-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/happytohelp-evidence
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload failure diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: failure-diagnostics-public-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/h2h-native-runtime-*/runtime.log
            /tmp/h2h-independent-*/runtime.log
            ${{ runner.temp }}/native-preview.log
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  legacy-export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: fixture-mysql-admin
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pfixture-mysql-admin"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Export two legacy projects and import each twice
        env:
          LEGACY_TEST_MYSQL_HOST: 127.0.0.1
          LEGACY_TEST_MYSQL_PASSWORD: fixture-mysql-admin
        run: node --test tests/legacy-export.mjs
